<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cortical">
<title>Cortical Agenda</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#07111f;--bg2:#0a1626;--panel:#0d1b2f;--text:#f7fbff;--muted:#9eb2ca;--line:#203a5a;--blue:#1687ff;--green:#28c76f;--red:#51222d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));min-height:100%}.app{max-width:900px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:23px;font-weight:900;letter-spacing:.13em}.sub,.date{font-size:12px;color:var(--muted)}.date{text-align:right;line-height:1.4}.panel{background:rgba(13,27,47,.96);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.syncbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.syncstate{font-size:13px;color:var(--muted);margin-top:4px}.hero{text-align:center;padding:24px 16px}.hero h1{font-size:25px;margin:0 0 7px}.hero p{color:var(--muted);margin:0 0 18px}.mic{width:164px;height:164px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#45a9ff,#1687ff 56%,#0855b7);box-shadow:0 0 0 11px rgba(22,135,255,.12),0 0 42px rgba(22,135,255,.36);color:white;font-size:63px}.mic.listening{background:radial-gradient(circle at 35% 30%,#68e59d,#22ba66 56%,#0c7c45);animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.035)}}.state{min-height:24px;margin-top:14px;color:#d9e9fa;font-weight:700}.live{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px}textarea{width:100%;min-height:82px;margin-top:14px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#08172a;color:white;font-size:16px}.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 16px;font-weight:800;transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}.btn:active{transform:scale(.97)}.primary{background:var(--green);color:#052414}.blue{background:var(--blue);color:white}.dark{background:#183252;color:white}.red{background:var(--red);color:#ffdadd}#corticalPanel{background:linear-gradient(135deg,#101d36 0%,#14294a 45%,#20163f 100%);border:1px solid #3c6fb2;box-shadow:0 12px 34px rgba(0,0,0,.34),0 0 28px rgba(22,135,255,.10)}#corticalPanel h2{margin-top:0;color:#ffffff;text-shadow:0 0 16px rgba(70,160,255,.35)}.nav-tile{min-width:132px;box-shadow:0 8px 18px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.20);font-size:14px}.nav-new{background:linear-gradient(135deg,#1687ff,#0057d9);color:#fff}.nav-agenda{background:linear-gradient(135deg,#2ecc71,#16884b);color:#fff}.nav-contacts{background:linear-gradient(135deg,#19c7d8,#087f99);color:#fff}.nav-calls{background:linear-gradient(135deg,#ff9f43,#d15b00);color:#fff}.nav-tasks{background:linear-gradient(135deg,#ffd43b,#c48a00);color:#1b1600}.nav-notes{background:linear-gradient(135deg,#a56cff,#6638d4);color:#fff}.nav-settings{background:linear-gradient(135deg,#7b8da6,#45566e);color:#fff}.nav-tile:hover{filter:brightness(1.08);box-shadow:0 10px 22px rgba(0,0,0,.34)}.nav-tile:active{filter:brightness(1.16)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:108px 1fr;gap:10px 12px}.label{color:var(--muted);font-weight:700}.val{font-weight:700;overflow-wrap:anywhere}.today-item{display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.time{font-size:21px;font-weight:900}.title{font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:5px}.badge{font-size:11px;border-radius:999px;background:#183a60;color:#dcecff;padding:5px 8px}.notice{background:#101f33;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.45;padding:12px;margin-top:12px;text-align:left}.empty{color:var(--muted);padding:10px 0 3px}@media(min-width:720px){.main-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.main-grid .panel{margin-bottom:0}.mic{width:188px;height:188px;font-size:70px}}@media(max-width:380px){.brand{font-size:20px}.hero h1{font-size:22px}.mic{width:148px;height:148px}.grid{grid-template-columns:91px 1fr}.today-item{grid-template-columns:57px 1fr}.today-item .badge{grid-column:2}.syncbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">CORTICAL</div><div class="sub">Agenda sencilla por voz</div></div><div class="date" id="dateLabel"></div></div>
  <section class="panel syncbar" id="settingsSection"><div><strong>Microsoft 365</strong><div class="syncstate" id="syncState">Sin conectar · guardado local</div></div><div class="row" style="margin:0"><button class="btn blue" id="connectBtn">Conectar</button><button class="btn dark hidden" id="syncBtn">Sincronizar</button></div></section>

  <section class="panel" id="corticalPanel">
    <h2>Panel Cortical</h2>
    <div class="row">
      <button class="btn nav-tile nav-new" id="navNew">🎙️ Nueva actividad</button>
      <button class="btn nav-tile nav-agenda" id="navAgenda">📅 Agenda</button>
      <button class="btn nav-tile nav-contacts" id="navContacts">👥 Contactos</button>
      <button class="btn nav-tile nav-calls" id="navCalls">☎️ Llamadas</button>
      <button class="btn nav-tile nav-tasks" id="navTasks">📝 Tareas</button>
      <button class="btn nav-tile nav-notes" id="navNotes">📌 Notas</button>
      <button class="btn nav-tile nav-settings" id="navSettings">⚙️ Configuración</button>
    </div>
  </section>

  <div class="main-grid">
    <section class="panel hero" id="voiceSection"><h1>Nueva actividad</h1><p>Pulsa una vez y habla de forma natural.</p><button class="mic" id="mic">🎙️</button><div class="state" id="state">Listo para escuchar</div><div class="live" id="liveText"></div><textarea id="transcript" placeholder='Ejemplo: "Mañana a las 10 llamar a Pedro para revisar contrato"'></textarea><div class="row"><button class="btn blue" id="interpret">Interpretar</button><button class="btn dark" id="clear">Limpiar</button></div><div class="notice" id="supportNote"></div></section>
    <section class="panel hidden" id="detected"><h2>He entendido</h2><div class="grid"><div class="label">Fecha</div><div class="val" id="vDate"></div><div class="label">Hora</div><div class="val" id="vTime"></div><div class="label">Tipo</div><div class="val" id="vType"></div><div class="label">Asunto</div><div class="val" id="vSubject"></div><div class="label">Persona</div><div class="val" id="vPerson"></div><div class="label">Teléfono</div><div class="val" id="vPhone"></div></div><div class="row"><button class="btn primary" id="save">✓ Guardar</button><button class="btn dark" id="modify">Modificar</button><button class="btn red" id="cancel">Cancelar</button></div></section>
  </div>
  <section class="panel" id="agendaSection"><h2>Hoy</h2><div id="todayList"></div></section>
  <section class="panel hidden" id="moduleSection"><h2 id="moduleTitle"></h2><div id="moduleList"></div></section>
</div>
<script type="module">
import { PublicClientApplication, InteractionRequiredAuthError } from 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.17.3/+esm';

const CLIENT_ID='10eecb87-23c7-47c8-ab84-6c475a27cb4b';
const TENANT_ID='8cec671b-7c03-40a2-9041-8c05cc606b86';
const SCOPES=['Files.ReadWrite.AppFolder'];
const GRAPH='https://graph.microsoft.com/v1.0';
const FILE_NAME='agenda.json';
const LOCAL_KEY='cortical-v03';

const q=id=>document.getElementById(id),mic=q('mic'),state=q('state'),live=q('liveText'),transcript=q('transcript'),detected=q('detected'),supportNote=q('supportNote'),syncState=q('syncState'),connectBtn=q('connectBtn'),syncBtn=q('syncBtn');
let current=null,listening=false,recognition=null;
const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pretty=d=>`${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}`,clean=s=>s.replace(/\s+/g,' ').trim();
const now=new Date();q('dateLabel').innerHTML=`${pretty(now)}<br>${pad(now.getHours())}:${pad(now.getMinutes())}`;

function nextWeekday(i){const d=new Date();d.setHours(0,0,0,0);let x=(i-d.getDay()+7)%7;if(x===0)x=7;d.setDate(d.getDate()+x);return d}
function parseDate(t){const l=t.toLowerCase();let d=new Date();d.setHours(0,0,0,0);if(/\bpasado mañana\b/.test(l)){d.setDate(d.getDate()+2);return d}if(/\bmañana\b/.test(l)){d.setDate(d.getDate()+1);return d}const map={domingo:0,lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6};for(const[n,i]of Object.entries(map))if(new RegExp(`\\b${n}\\b`,'i').test(l))return nextWeekday(i);const m=l.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);if(m){let y=m[3]?Number(m[3]):new Date().getFullYear();if(y<100)y+=2000;return new Date(y,Number(m[2])-1,Number(m[1]))}return d}
function parseTime(t){const l=t.toLowerCase();let m=l.match(/\b(?:a\s+las?\s+)?([01]?\d|2[0-3])[:.](\d{2})\b/);if(m)return`${pad(Number(m[1]))}:${m[2]}`;m=l.match(/\b(?:a\s+las?\s+)(\d{1,2})\b/);return m&&Number(m[1])<=23?`${pad(Number(m[1]))}:00`:'Sin hora'}
function parsePhone(t){const m=t.match(/(?:\+34[\s.-]*)?(?:\d[\s.-]*){9}/);return m?m[0].replace(/[^\d+]/g,''):'—'}
function typeOf(t){const l=t.toLowerCase();if(/\b(llamar|llamada)\b/.test(l))return'Llamada';if(/\b(reuni[oó]n|reunirme)\b/.test(l))return'Reunión';if(/\b(visita|visitar)\b/.test(l))return'Visita';if(/\b(recordar|recu[eé]rdame|recordarme|tarea)\b/.test(l))return'Tarea';if(/\b(nota|apunta|anota)\b/.test(l))return'Nota';if(/\b(enviar|mandar|gestionar|preparar)\b/.test(l))return'Gestión';return'Actividad'}
function personOf(t){let m=t.match(/\bcon\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);if(!m)m=t.match(/\b(?:llamar|llama)\s+a\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);return m?m[1]:'—'}
function subjectOf(t,p,ph){let s=t.replace(/\b(hoy|mañana|pasado mañana|lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/gi,' ').replace(/\b(?:a\s+las?\s+)?\d{1,2}(?::\d{2})?\b/gi,' ');if(p!=='—')s=s.replace(new RegExp(`\\bcon\\s+${p}\\b`,'i'),' ');if(ph!=='—')s=s.replace(ph,' ');return clean(s.replace(/\b(teléfono|telefono|móvil|movil)\b/gi,' '))||'Actividad'}
function parse(t){const d=parseDate(t),ph=parsePhone(t),p=personOf(t);return{id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,date:iso(d),dateText:pretty(d),time:parseTime(t),type:typeOf(t),subject:subjectOf(t,p,ph),person:p,phone:ph,raw:t,updatedAt:new Date().toISOString()}}
function show(x){current=x;q('vDate').textContent=x.dateText;q('vTime').textContent=x.time;q('vType').textContent=x.type;q('vSubject').textContent=x.subject;q('vPerson').textContent=x.person;q('vPhone').textContent=x.phone;detected.classList.remove('hidden');state.textContent='Actividad interpretada'}
function interpret(){const t=clean(transcript.value);if(!t){state.textContent='Habla o escribe una actividad primero';return}show(parse(t))}
function load(){try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||localStorage.getItem('cortical-v02')||'[]')}catch{return[]}}
function store(a){localStorage.setItem(LOCAL_KEY,JSON.stringify(a))}
function merge(local,remote){const m=new Map();[...local,...remote].forEach(x=>{if(!x.id)x.id=`legacy-${x.date}-${x.time}-${x.raw||x.subject}`;const old=m.get(x.id);if(!old||String(x.updatedAt||'')>=String(old.updatedAt||''))m.set(x.id,x)});return[...m.values()]}
function renderToday(){const box=q('todayList'),today=iso(new Date()),arr=load().filter(x=>x.date===today).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">No tienes actividades guardadas para hoy.</div>';return}arr.forEach(x=>{const e=document.createElement('div');e.className='today-item';e.innerHTML=`<div class="time">${x.time}</div><div><div class="title"></div><div class="meta"></div></div><div class="badge">${x.type}</div>`;e.querySelector('.title').textContent=x.subject;e.querySelector('.meta').textContent=[x.person!=='—'?x.person:'',x.phone!=='—'?x.phone:''].filter(Boolean).join(' · ');box.appendChild(e)})}

const msal=new PublicClientApplication({auth:{clientId:CLIENT_ID,authority:`https://login.microsoftonline.com/${TENANT_ID}`,redirectUri:'https://hark0rnette.github.io/cortical-agenda/',postLogoutRedirectUri:'https://hark0rnette.github.io/cortical-agenda/'},cache:{cacheLocation:'localStorage'}});
await msal.initialize();
const redirectResult=await msal.handleRedirectPromise();
if(redirectResult?.account)msal.setActiveAccount(redirectResult.account);
if(!msal.getActiveAccount()&&msal.getAllAccounts().length)msal.setActiveAccount(msal.getAllAccounts()[0]);

function setConnectedUI(){const a=msal.getActiveAccount();if(a){connectBtn.textContent='Conectado';connectBtn.classList.remove('blue');connectBtn.classList.add('dark');syncBtn.classList.remove('hidden');syncState.textContent=`Conectado a Microsoft 365 · ${a.username||''}`;}else{connectBtn.textContent='Conectar';syncBtn.classList.add('hidden');syncState.textContent='Sin conectar · guardado local';}}
setConnectedUI();

async function token(){const a=msal.getActiveAccount();if(!a)throw new Error('NO_ACCOUNT');try{return(await msal.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){if(e instanceof InteractionRequiredAuthError){await msal.acquireTokenRedirect({scopes:SCOPES,account:a});return null}throw e}}
async function graph(path,opts={}){const t=await token();if(!t)return null;const r=await fetch(`${GRAPH}${path}`,{...opts,headers:{Authorization:`Bearer ${t}`,...(opts.headers||{})}});if(!r.ok){const txt=await r.text();throw new Error(`${r.status} ${txt}`)}return r}
async function readRemote(){try{await graph('/me/drive/special/approot');const r=await graph(`/me/drive/special/approot:/${FILE_NAME}:/content`);if(!r)return[];return await r.json()}catch(e){if(String(e.message).startsWith('404'))return[];throw e}}
async function writeRemote(items){await graph('/me/drive/special/approot');await graph(`/me/drive/special/approot:/${FILE_NAME}:/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(items,null,2)})}
async function syncNow(){if(!msal.getActiveAccount())return;syncState.textContent='Sincronizando…';try{const merged=merge(load(),await readRemote());store(merged);await writeRemote(merged);renderToday();syncState.textContent=`Sincronizado · ${new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}`;}catch(e){console.error(e);syncState.textContent='No se pudo sincronizar · los datos siguen guardados en este dispositivo'}}

connectBtn.onclick=async()=>{if(msal.getActiveAccount()){await syncNow();return}await msal.loginRedirect({scopes:SCOPES})};syncBtn.onclick=syncNow;
q('interpret').onclick=interpret;q('clear').onclick=()=>{transcript.value='';live.textContent='';detected.classList.add('hidden');state.textContent='Listo para escuchar'};q('cancel').onclick=q('clear').onclick;q('modify').onclick=()=>{detected.classList.add('hidden');transcript.focus()};q('save').onclick=async()=>{if(!current)return;const a=load();a.push(current);store(a);renderToday();state.textContent='Guardado';detected.classList.add('hidden');transcript.value='';current=null;if(msal.getActiveAccount())await syncNow()};

function scrollToId(id){q(id)?.scrollIntoView({behavior:'smooth',block:'start'})}
function renderModule(title,items,kind){const box=q('moduleList');q('moduleTitle').textContent=title;box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">No hay elementos guardados.</div>'}else if(kind==='contacts'){items.forEach(x=>{const e=document.createElement('div');e.className='today-item';e.innerHTML='<div class="time">👤</div><div><div class="title"></div><div class="meta"></div></div><div class="badge">Contacto</div>';e.querySelector('.title').textContent=x.person;e.querySelector('.meta').textContent=x.phone;box.appendChild(e)})}else{items.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'99:99').localeCompare(b.time||'99:99')).forEach(x=>{const e=document.createElement('div');e.className='today-item';e.innerHTML=`<div class="time">${x.time||'—'}</div><div><div class="title"></div><div class="meta"></div></div><div class="badge">${x.type||title}</div>`;e.querySelector('.title').textContent=x.subject||x.raw||'Actividad';e.querySelector('.meta').textContent=[x.date,x.person&&x.person!=='—'?x.person:'',x.phone&&x.phone!=='—'?x.phone:''].filter(Boolean).join(' · ');box.appendChild(e)})}q('moduleSection').classList.remove('hidden');scrollToId('moduleSection')}
q('navNew').onclick=()=>{scrollToId('voiceSection');setTimeout(()=>transcript.focus({preventScroll:true}),350)};
q('navAgenda').onclick=()=>scrollToId('agendaSection');
q('navSettings').onclick=()=>scrollToId('settingsSection');
q('navCalls').onclick=()=>renderModule('Llamadas',load().filter(x=>x.type==='Llamada'));
q('navTasks').onclick=()=>renderModule('Tareas',load().filter(x=>x.type==='Tarea'));
q('navNotes').onclick=()=>renderModule('Notas',load().filter(x=>x.type==='Nota'));
q('navContacts').onclick=()=>{const seen=new Map();load().forEach(x=>{const person=x.person&&x.person!=='—'?x.person:'';const phone=x.phone&&x.phone!=='—'?x.phone:'';if(!person&&!phone)return;const key=`${person}|${phone}`;if(!seen.has(key))seen.set(key,{person:person||'Sin nombre',phone:phone||'Sin teléfono'})});renderModule('Contactos',[...seen.values()],'contacts')};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){recognition=new SR();recognition.lang='es-ES';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{listening=true;mic.classList.add('listening');state.textContent='Escuchando…';live.textContent='Habla ahora'};recognition.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)final+=s;else interim+=s}if(interim)live.textContent=interim;if(final){transcript.value=clean(`${transcript.value} ${final}`);live.textContent='';setTimeout(interpret,120)}};recognition.onend=()=>{listening=false;mic.classList.remove('listening');if(state.textContent==='Escuchando…')state.textContent='Listo para escuchar'};recognition.onerror=e=>{state.textContent=e.error==='not-allowed'?'Permiso de micrófono denegado':'No he podido escuchar. Puedes escribir o usar el micrófono del teclado.'}}else{supportNote.innerHTML='<strong>En este navegador el botón azul puede no tener reconocimiento de voz directo.</strong><br>En iPhone/iPad toca el cuadro de texto y usa el micrófono del teclado; después pulsa Interpretar.';state.textContent='Puedes dictar con el teclado'}
mic.onclick=()=>{if(!recognition){transcript.focus();return}if(listening)recognition.stop();else{try{recognition.start()}catch{}}};
renderToday();
if(msal.getActiveAccount())syncNow();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
