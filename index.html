<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cortical">
<title>Cortical Agenda</title>
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{--bg:#07111f;--bg2:#0a1626;--panel:#0d1b2f;--text:#f7fbff;--muted:#9eb2ca;--line:#203a5a;--blue:#1687ff;--green:#28c76f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));min-height:100%}
.app{max-width:900px;margin:auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:23px;font-weight:900;letter-spacing:.13em}.sub,.date{font-size:12px;color:var(--muted)}.date{text-align:right;line-height:1.4}.panel{background:rgba(13,27,47,.96);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}.hero{text-align:center;padding:24px 16px}.hero h1{font-size:25px;margin:0 0 7px}.hero p{color:var(--muted);margin:0 0 18px}.mic{width:164px;height:164px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#45a9ff,#1687ff 56%,#0855b7);box-shadow:0 0 0 11px rgba(22,135,255,.12),0 0 42px rgba(22,135,255,.36);color:white;font-size:63px}.mic.listening{background:radial-gradient(circle at 35% 30%,#68e59d,#22ba66 56%,#0c7c45);animation:pulse .9s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.035)}}.state{min-height:24px;margin-top:14px;color:#d9e9fa;font-weight:700}.live{margin-top:10px;color:var(--muted);font-size:14px;min-height:20px}textarea{width:100%;min-height:82px;margin-top:14px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#08172a;color:white;font-size:16px}.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:12px}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 16px;font-weight:800}.primary{background:var(--green);color:#052414}.blue{background:var(--blue);color:white}.dark{background:#183252;color:white}.red{background:#51222d;color:#ffdadd}.hidden{display:none!important}.grid{display:grid;grid-template-columns:108px 1fr;gap:10px 12px}.grid .label{color:var(--muted);font-weight:700}.grid .val{font-weight:700;overflow-wrap:anywhere}.today-item{display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:start;padding:13px 0;border-bottom:1px solid var(--line)}.time{font-size:21px;font-weight:900}.title{font-weight:800}.meta{color:var(--muted);font-size:13px;margin-top:5px}.badge{font-size:11px;border-radius:999px;background:#183a60;color:#dcecff;padding:5px 8px}.notice{background:#101f33;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.45;padding:12px;margin-top:12px;text-align:left}.empty{color:var(--muted);padding:10px 0 3px}@media(min-width:720px){.main-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:14px}.main-grid .panel{margin-bottom:0}.mic{width:188px;height:188px;font-size:70px}}@media(max-width:380px){.brand{font-size:20px}.hero h1{font-size:22px}.mic{width:148px;height:148px}.grid{grid-template-columns:91px 1fr}.today-item{grid-template-columns:57px 1fr}.today-item .badge{grid-column:2}}
</style>
</head>
<body>
<div class="app"><div class="top"><div><div class="brand">CORTICAL</div><div class="sub">Agenda sencilla por voz</div></div><div class="date" id="dateLabel"></div></div><div class="main-grid"><section class="panel hero"><h1>Nueva actividad</h1><p>Pulsa una vez y habla de forma natural.</p><button class="mic" id="mic">🎙️</button><div class="state" id="state">Listo para escuchar</div><div class="live" id="liveText"></div><textarea id="transcript" placeholder='Ejemplo: "Mañana a las 10 llamar a Pedro para revisar contrato"'></textarea><div class="row"><button class="btn blue" id="interpret">Interpretar</button><button class="btn dark" id="clear">Limpiar</button></div><div class="notice" id="supportNote"></div></section><section class="panel hidden" id="detected"><h2>He entendido</h2><div class="grid"><div class="label">Fecha</div><div class="val" id="vDate"></div><div class="label">Hora</div><div class="val" id="vTime"></div><div class="label">Tipo</div><div class="val" id="vType"></div><div class="label">Asunto</div><div class="val" id="vSubject"></div><div class="label">Persona</div><div class="val" id="vPerson"></div><div class="label">Teléfono</div><div class="val" id="vPhone"></div></div><div class="row"><button class="btn primary" id="save">✓ Guardar</button><button class="btn dark" id="modify">Modificar</button><button class="btn red" id="cancel">Cancelar</button></div></section></div><section class="panel"><h2>Hoy</h2><div id="todayList"></div></section></div>
<script>
(()=>{const q=id=>document.getElementById(id),mic=q('mic'),state=q('state'),live=q('liveText'),transcript=q('transcript'),detected=q('detected'),supportNote=q('supportNote');let current=null,listening=false,recognition=null;const days=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pretty=d=>`${days[d.getDay()]}, ${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}`,clean=s=>s.replace(/\s+/g,' ').trim();const now=new Date();q('dateLabel').innerHTML=`${pretty(now)}<br>${pad(now.getHours())}:${pad(now.getMinutes())}`;function nextWeekday(i){const d=new Date();d.setHours(0,0,0,0);let x=(i-d.getDay()+7)%7;if(x===0)x=7;d.setDate(d.getDate()+x);return d}function parseDate(t){const l=t.toLowerCase();let d=new Date();d.setHours(0,0,0,0);if(/\bpasado mañana\b/.test(l)){d.setDate(d.getDate()+2);return d}if(/\bmañana\b/.test(l)){d.setDate(d.getDate()+1);return d}const map={domingo:0,lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6};for(const[n,i]of Object.entries(map))if(new RegExp(`\\b${n}\\b`,'i').test(l))return nextWeekday(i);const m=l.match(/\b(\d{1,2})[\/-](\d{1,2})(?:[\/-](\d{2,4}))?\b/);if(m){let y=m[3]?Number(m[3]):new Date().getFullYear();if(y<100)y+=2000;return new Date(y,Number(m[2])-1,Number(m[1]))}return d}function parseTime(t){const l=t.toLowerCase();let m=l.match(/\b(?:a\s+las?\s+)?([01]?\d|2[0-3])[:.](\d{2})\b/);if(m)return`${pad(Number(m[1]))}:${m[2]}`;m=l.match(/\b(?:a\s+las?\s+)(\d{1,2})\b/);return m&&Number(m[1])<=23?`${pad(Number(m[1]))}:00`:'Sin hora'}function parsePhone(t){const m=t.match(/(?:\+34[\s.-]*)?(?:\d[\s.-]*){9}/);return m?m[0].replace(/[^\d+]/g,''):'—'}function typeOf(t){const l=t.toLowerCase();if(/\b(llamar|llamada)\b/.test(l))return'Llamada';if(/\b(reuni[oó]n|reunirme)\b/.test(l))return'Reunión';if(/\b(visita|visitar)\b/.test(l))return'Visita';if(/\b(recordar|recu[eé]rdame|recordarme|tarea)\b/.test(l))return'Tarea';if(/\b(nota|apunta|anota)\b/.test(l))return'Nota';return'Actividad'}function personOf(t){let m=t.match(/\bcon\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);if(!m)m=t.match(/\b(?:llamar|llama)\s+a\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);return m?m[1]:'—'}function subjectOf(t,p,ph){let s=t.replace(/\b(hoy|mañana|pasado mañana|lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/gi,' ').replace(/\b(?:a\s+las?\s+)?\d{1,2}(?::\d{2})?\b/gi,' ');if(p!=='—')s=s.replace(new RegExp(`\\bcon\\s+${p}\\b`,'i'),' ');if(ph!=='—')s=s.replace(ph,' ');return clean(s.replace(/\b(teléfono|telefono|móvil|movil)\b/gi,' '))||'Actividad'}function parse(t){const d=parseDate(t),ph=parsePhone(t),p=personOf(t);return{date:iso(d),dateText:pretty(d),time:parseTime(t),type:typeOf(t),subject:subjectOf(t,p,ph),person:p,phone:ph,raw:t}}function show(x){current=x;q('vDate').textContent=x.dateText;q('vTime').textContent=x.time;q('vType').textContent=x.type;q('vSubject').textContent=x.subject;q('vPerson').textContent=x.person;q('vPhone').textContent=x.phone;detected.classList.remove('hidden');state.textContent='Actividad interpretada'}function interpret(){const t=clean(transcript.value);if(!t){state.textContent='Habla o escribe una actividad primero';return}show(parse(t))}function load(){try{return JSON.parse(localStorage.getItem('cortical-v02')||'[]')}catch{return[]}}function store(a){localStorage.setItem('cortical-v02',JSON.stringify(a))}function renderToday(){const box=q('todayList'),today=iso(new Date()),arr=load().filter(x=>x.date===today).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));box.innerHTML='';if(!arr.length){box.innerHTML='<div class="empty">No tienes actividades guardadas para hoy.</div>';return}arr.forEach(x=>{const e=document.createElement('div');e.className='today-item';e.innerHTML=`<div class="time">${x.time}</div><div><div class="title"></div><div class="meta"></div></div><div class="badge">${x.type}</div>`;e.querySelector('.title').textContent=x.subject;e.querySelector('.meta').textContent=[x.person!=='—'?x.person:'',x.phone!=='—'?x.phone:''].filter(Boolean).join(' · ');box.appendChild(e)})}q('interpret').onclick=interpret;q('clear').onclick=()=>{transcript.value='';live.textContent='';detected.classList.add('hidden');state.textContent='Listo para escuchar'};q('cancel').onclick=()=>{detected.classList.add('hidden');current=null;state.textContent='Actividad cancelada'};q('modify').onclick=()=>{detected.classList.add('hidden');transcript.focus();state.textContent='Modifica la frase y vuelve a interpretar'};q('save').onclick=()=>{if(!current)return;const a=load();a.push(current);store(a);renderToday();transcript.value='';detected.classList.add('hidden');state.textContent='✓ Actividad guardada';current=null};const SR=window.SpeechRecognition||window.webkitSpeechRecognition,isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent);if(SR){recognition=new SR();recognition.lang='es-ES';recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{listening=true;mic.classList.add('listening');state.textContent='Escuchando…';live.textContent='Habla ahora'};recognition.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const t=e.results[n][0].transcript;e.results[n].isFinal?f+=t:i+=t}if(i)live.textContent=i;if(f){transcript.value=clean((transcript.value+' '+f));live.textContent=f}};recognition.onerror=()=>{state.textContent='No se pudo reconocer la voz'};recognition.onend=()=>{listening=false;mic.classList.remove('listening');transcript.value.trim()?interpret():state.textContent='Listo para escuchar'};mic.onclick=()=>{try{listening?recognition.stop():recognition.start()}catch{}};supportNote.textContent=isiOS?'En iPhone/iPad, abre esta prueba en Safari y permite el micrófono cuando iOS lo solicite.':'El reconocimiento de voz está disponible en este navegador.'}else{mic.onclick=()=>{transcript.focus();state.textContent='Voz directa no disponible';live.textContent='Usa el micrófono del teclado del iPhone/iPad y después pulsa Interpretar.'};supportNote.textContent='Este navegador no expone reconocimiento de voz directo. En iPhone/iPad prueba Safari; si no funciona, usa el dictado del teclado como respaldo.'}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});renderToday()})();
</script></body></html>
