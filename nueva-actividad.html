<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Nueva actividad · Cortical</title><link rel="stylesheet" href="./cortical.css"></head><body><div class="app"><a class="back" href="./index.html">← Panel Cortical</a><div class="top"><div><div class="brand">CORTICAL</div><div class="sub">Nueva actividad</div></div><div class="date" id="dateLabel"></div></div><section class="panel hero"><h1>🎙️ Nueva actividad</h1><p class="muted">Pulsa el micrófono y habla de forma natural.</p><button class="mic" id="mic">🎙️</button><div class="state" id="state">Listo para escuchar</div><div class="live" id="live"></div><textarea id="transcript" placeholder='Ejemplo: "Mañana a las 10 llamar a Pedro para revisar contrato"'></textarea><div class="row"><button class="btn blue" id="interpret">Interpretar</button><button class="btn dark" id="clear">Limpiar</button></div></section><section class="panel hidden" id="detected"><h2>He entendido</h2><div class="grid"><div class="label">Fecha</div><div class="val" id="vDate"></div><div class="label">Hora</div><div class="val" id="vTime"></div><div class="label">Tipo</div><div class="val" id="vType"></div><div class="label">Asunto</div><div class="val" id="vSubject"></div><div class="label">Persona</div><div class="val" id="vPerson"></div><div class="label">Teléfono</div><div class="val" id="vPhone"></div></div><div class="row"><button class="btn primary" id="save">✓ Guardar</button><button class="btn red" id="cancel">Cancelar</button></div></section></div><script type="module">import{q,load,store,iso,pad,setDateLabel}from'./cortical-common.js';setDateLabel();let current=null;const clean=s=>s.replace(/\s+/g,' ').trim();function nextWeekday(i){const d=new Date();d.setHours(0,0,0,0);let x=(i-d.getDay()+7)%7;if(!x)x=7;d.setDate(d.getDate()+x);return d}function parseDate(t){const l=t.toLowerCase();let d=new Date();d.setHours(0,0,0,0);if(/pasado mañana/.test(l)){d.setDate(d.getDate()+2);return d}if(/mañana/.test(l)){d.setDate(d.getDate()+1);return d}const m={domingo:0,lunes:1,martes:2,'miércoles':3,miercoles:3,jueves:4,viernes:5,'sábado':6,sabado:6};for(const[n,i]of Object.entries(m))if(new RegExp('\\b'+n+'\\b','i').test(l))return nextWeekday(i);return d}function parseTime(t){let m=t.toLowerCase().match(/(?:a\s+las?\s+)?([01]?\d|2[0-3])[:.](\d{2})/);if(m)return`${pad(+m[1])}:${m[2]}`;m=t.toLowerCase().match(/a\s+las?\s+(\d{1,2})/);return m?`${pad(+m[1])}:00`:'Sin hora'}function typeOf(t){const l=t.toLowerCase();if(/llamar|llamada/.test(l))return'Llamada';if(/reuni[oó]n/.test(l))return'Reunión';if(/visita|visitar/.test(l))return'Visita';if(/recordar|recu[eé]rdame|recordarme|tarea/.test(l))return'Tarea';if(/nota|apunta|anota/.test(l))return'Nota';if(/enviar|mandar|gestionar|preparar/.test(l))return'Gestión';return'Actividad'}function phoneOf(t){const m=t.match(/(?:\+34[\s.-]*)?(?:\d[\s.-]*){9}/);return m?m[0].replace(/[^\d+]/g,''):'—'}function personOf(t){let m=t.match(/\bcon\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);if(!m)m=t.match(/\b(?:llamar|llama)\s+a\s+([A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}ÁÉÍÓÚÑáéíóúñ-]+){0,2})/u);return m?m[1]:'—'}function subjectOf(t,p,ph){let s=t.replace(/\b(hoy|mañana|pasado mañana|lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/gi,' ').replace(/\b(?:a\s+las?\s+)?\d{1,2}(?::\d{2})?\b/gi,' ');if(p!=='—')s=s.replace(new RegExp('\\bcon\\s+'+p+'\\b','i'),' ');if(ph!=='—')s=s.replace(ph,' ');return clean(s.replace(/\b(teléfono|telefono|móvil|movil)\b/gi,' '))||'Actividad'}function parse(t){const d=parseDate(t),phone=phoneOf(t),person=personOf(t);return{id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:iso(d),time:parseTime(t),type:typeOf(t),subject:subjectOf(t,person,phone),person,phone,raw:t,updatedAt:new Date().toISOString()}}function show(x){current=x;q('vDate').textContent=x.date;q('vTime').textContent=x.time;q('vType').textContent=x.type;q('vSubject').textContent=x.subject;q('vPerson').textContent=x.person;q('vPhone').textContent=x.phone;q('detected').classList.remove('hidden');q('state').textContent='Actividad interpretada'}q('interpret').onclick=()=>{const t=clean(q('transcript').value);if(t)show(parse(t));else q('state').textContent='Habla o escribe una actividad primero'};q('clear').onclick=()=>{q('transcript').value='';q('live').textContent='';q('detected').classList.add('hidden')};q('cancel').onclick=()=>q('detected').classList.add('hidden');q('save').onclick=()=>{if(!current)return;const a=load();a.push(current);store(a);q('state').textContent='✓ Guardado';q('detected').classList.add('hidden');q('transcript').value='';current=null};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='es-ES';r.interimResults=true;r.continuous=false;r.onstart=()=>{q('mic').classList.add('listening');q('state').textContent='Escuchando…'};r.onresult=e=>{let f='',i='';for(let n=e.resultIndex;n<e.results.length;n++){const s=e.results[n][0].transcript;if(e.results[n].isFinal)f+=s;else i+=s}q('live').textContent=i;if(f){q('transcript').value=clean((q('transcript').value+' '+f));q('live').textContent=''}};r.onend=()=>{q('mic').classList.remove('listening');q('state').textContent='Listo para interpretar';if(clean(q('transcript').value))show(parse(clean(q('transcript').value)))};q('mic').onclick=()=>r.start()}else{q('state').textContent='Usa el micrófono del teclado para dictar';q('mic').onclick=()=>q('transcript').focus()}</script></body></html>
