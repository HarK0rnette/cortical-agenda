<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Contactos · Cortical</title><link rel="stylesheet" href="./cortical.css"></head><body><div class="app"><a class="back" href="./index.html">← Panel Cortical</a><div class="top"><div><div class="brand">CORTICAL</div><div class="sub">Contactos</div></div><div class="date" id="dateLabel"></div></div><section class="panel"><h1>👥 Contactos</h1><p class="muted">Contactos detectados en tus actividades guardadas.</p><div class="cardlist" id="contacts"></div></section></div><script type="module">import{q,uniqueContacts,setDateLabel}from'./cortical-common.js';setDateLabel();const box=q('contacts'),arr=uniqueContacts();if(!arr.length)box.innerHTML='<div class="empty">Todavía no hay contactos guardados.</div>';else arr.forEach(x=>{const e=document.createElement('div');e.className='contact';const p=x.phone&&x.phone!=='—'?`<a class="phone" href="tel:${x.phone}">☎ ${x.phone}</a>`:'<span class="muted">Sin teléfono</span>';e.innerHTML=`<div class="title"></div><div class="meta">${p}</div>`;e.querySelector('.title').textContent=x.person;box.appendChild(e)});</script></body></html>
