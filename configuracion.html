<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Configuración · Cortical</title><link rel="stylesheet" href="./cortical.css"></head><body><div class="app"><a class="back" href="./index.html">← Panel Cortical</a><div class="top"><div><div class="brand">CORTICAL</div><div class="sub">Configuración</div></div><div class="date" id="dateLabel"></div></div><section class="panel"><h1>⚙️ Configuración</h1><div class="syncbar"><div><strong>Microsoft 365</strong><div class="muted" id="syncState">Comprobando conexión…</div></div><div class="row"><button class="btn blue" id="connectBtn">Conectar</button><button class="btn dark hidden" id="syncBtn">Sincronizar</button></div></div></section></div><script type="module">import{PublicClientApplication,InteractionRequiredAuthError}from'https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.17.3/+esm';import{q,load,store,setDateLabel}from'./cortical-common.js';setDateLabel();const CLIENT_ID='10eecb87-23c7-47c8-ab84-6c475a27cb4b',TENANT_ID='8cec671b-7c03-40a2-9041-8c05cc606b86',SCOPES=['Files.ReadWrite.AppFolder'],GRAPH='https://graph.microsoft.com/v1.0',FILE_NAME='agenda.json',ROOT='https://hark0rnette.github.io/cortical-agenda/';const msal=new PublicClientApplication({auth:{clientId:CLIENT_ID,authority:`https://login.microsoftonline.com/${TENANT_ID}`,redirectUri:ROOT,postLogoutRedirectUri:ROOT},cache:{cacheLocation:'localStorage'}});await msal.initialize();const rr=await msal.handleRedirectPromise();if(rr?.account)msal.setActiveAccount(rr.account);if(!msal.getActiveAccount()&&msal.getAllAccounts().length)msal.setActiveAccount(msal.getAllAccounts()[0]);function ui(){const a=msal.getActiveAccount();if(a){q('connectBtn').textContent='Conectado';q('syncBtn').classList.remove('hidden');q('syncState').textContent=`Conectado a Microsoft 365 · ${a.username||''}`}else{q('connectBtn').textContent='Conectar';q('syncBtn').classList.add('hidden');q('syncState').textContent='Sin conectar · guardado local'}}ui();async function token(){const a=msal.getActiveAccount();if(!a)throw new Error('NO_ACCOUNT');try{return(await msal.acquireTokenSilent({scopes:SCOPES,account:a})).accessToken}catch(e){if(e instanceof InteractionRequiredAuthError){await msal.acquireTokenRedirect({scopes:SCOPES,account:a});return null}throw e}}async function graph(path,opts={}){const t=await token();if(!t)return null;const r=await fetch(GRAPH+path,{...opts,headers:{Authorization:`Bearer ${t}`,...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());return r}function merge(a,b){const m=new Map();[...a,...b].forEach(x=>{const id=x.id||`legacy-${x.date}-${x.time}-${x.raw||x.subject}`;const old=m.get(id);if(!old||String(x.updatedAt||'')>=String(old.updatedAt||''))m.set(id,{...x,id})});return[...m.values()]}async function sync(){try{q('syncState').textContent='Sincronizando…';await graph('/me/drive/special/approot');let remote=[];try{const r=await graph(`/me/drive/special/approot:/${FILE_NAME}:/content`);if(r)remote=await r.json()}catch{}const all=merge(load(),Array.isArray(remote)?remote:[]);store(all);await graph(`/me/drive/special/approot:/${FILE_NAME}:/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(all,null,2)});q('syncState').textContent='✓ Sincronizado con Microsoft 365'}catch(e){q('syncState').textContent='Error de sincronización'}}q('connectBtn').onclick=async()=>{if(msal.getActiveAccount())return;await msal.loginRedirect({scopes:SCOPES})};q('syncBtn').onclick=sync;if(msal.getActiveAccount())sync();</script></body></html>
